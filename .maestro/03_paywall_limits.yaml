appId: com.jonathan.blnd-ios
---
- launchApp
- runFlow:
    when:
      visible:
        id: auth.welcome.sign-in
    file: subflows/00_sign_in_steps.yaml
- assertVisible:
    id: home.search
- tapOn:
    id: reels.tutorial.skip
    optional: true
- tapOn:
    id: home.paywall
- assertVisible: "2 AI searches a day free, 50 on blnd+"
- assertVisible: "4 members free, 12 on blnd+"
