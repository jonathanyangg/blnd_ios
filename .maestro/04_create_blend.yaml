appId: com.jonathan.blnd-ios
---
- launchApp
- runFlow:
    when:
      visible:
        id: auth.welcome.sign-in
    file: subflows/00_sign_in_steps.yaml
- assertVisible:
    id: find-movie-now.entry
- tapOn:
    text: Blends
- assertVisible:
    id: blends.create
- tapOn:
    id: blends.create
- assertVisible: New Blend
- tapOn:
    id: blends.name
    optional: true
- tapOn:
    text: Blend name...
    optional: true
- inputText: Maestro Blend
- tapOn:
    id: blends.create.submit
- assertVisible: "Add Member"
- tapOn:
    id: blends.members.done
- assertVisible:
    id: blends.group
