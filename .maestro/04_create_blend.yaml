appId: com.jonathan.blnd-ios
---
- launchApp
- runFlow:
    when:
      visible:
        id: auth.welcome.sign-in
    file: subflows/00_sign_in_steps.yaml
- assertVisible:
    id: home.search
- tapOn:
    text: Blends
- assertVisible:
    id: blends.create
- tapOn:
    id: blends.create
- assertVisible: New Blend
- tapOn:
    id: blends.name
    optional: true
- tapOn:
    text: Blend name...
    optional: true
- eraseText
- inputText: Maestro Blend
- tapOn:
    id: blends.create.submit
# Create opens the new blend directly; go back to see it in the list.
- extendedWaitUntil:
    visible:
      id: blend.findMovie
    timeout: 15000
- swipe:
    start: 2%, 50%
    end: 80%, 50%
- assertVisible:
    id: blends.group
