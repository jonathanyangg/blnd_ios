appId: com.jonathan.blnd-ios
---
- runFlow:
    when:
      visible:
        id: auth.welcome.sign-in
    commands:
      - tapOn:
          id: auth.welcome.sign-in
      - tapOn:
          id: auth.email
      - inputText: ${EMAIL}
      - tapOn:
          id: auth.password
      - inputText: ${PASSWORD}
      - tapOn:
          id: auth.submit
      - tapOn:
          text: Not Now
          optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd:
    timeout: 30000
- assertVisible:
    id: home.search
