# Ensure the app is signed out and sitting on the welcome screen.
appId: com.jonathan.blnd-ios
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: auth.welcome.sign-in
    commands:
      - extendedWaitUntil:
          visible:
            id: home.search
          timeout: 30000
      - extendedWaitUntil:
          visible: Skip
          timeout: 4000
          optional: true
      - tapOn:
          text: Skip
          optional: true
      - tapOn:
          id: profile.tab
      - tapOn:
          id: profile.settings
      - scrollUntilVisible:
          element:
            id: profile.log-out
      - tapOn:
          id: profile.log-out
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: auth.welcome.sign-in
    timeout: 15000
